// Satuan pemakaian yang boleh dipilih di resep, per kelas bahan.
const SATUAN_PAKAI = {
  berat:  ["g", "kg", "sdt", "sdm", "gelas", "ml", "l"],
  volume: ["ml", "l", "sdt", "sdm", "gelas", "g", "kg"],

};

const SATUAN_BERAT = ["g", "kg"];

// Satuan yang tersedia untuk sebuah bahan, termasuk pembagian bahan hitungan.
function satuanUntuk(b) {
  if (!b) return ["g"];
  if (b.kelas === "hitung") {
    const out = ["pcs"];
    if (b.pembagian && b.pembagian.nama && Number(b.pembagian.jumlah) > 1) out.push(b.pembagian.nama);
    if (Number(b.gramPerPcs) > 0) out.push("g", "kg");
    return out;
  }
  return SATUAN_PAKAI[b.kelas];
}

// Nama satuan beli yang ditampilkan (ekor, ikat, botol, ...).
function labelSatuan(b, sat) {
  return b && b.kelas === "hitung" && sat === "pcs" ? (b.satuanLabel || "pcs") : sat;
}

// Satu angka densitas (g/ml) berlaku untuk semua bahan, diturunkan dari setting "1 sdt = N gram".
// Tidak ada kalibrasi per bahan - kesederhanaan dipilih sebagai ganti presisi per bahan.
function globalDensitas() {
  const s = state.settings;
  if (s.gramSdtDefault > 0 && s.mlSdt > 0) return s.gramSdtDefault / s.mlSdt;
  return NaN;
}

const DEFAULT_STATE = () => ({
  version: 1,
  settings: {
    mlSdt: 5,
    mlSdm: 15,
    mlGelas: 240,
    gramSdtDefault: 5,
    staleDays: 30,
    marginDefault: 30,
    channels: [],
  },
  bahan: [],
  menu: [],
  bundling: [],
});

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function rp(n) {
  if (!isFinite(n)) return "-";
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}

function num(n, dec = 2) {
  if (!isFinite(n)) return "-";
  return Number(n.toFixed(dec)).toLocaleString("id-ID");
}

function todayISO() {
  return new Date().toISOString();
}

function hariSejak(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function tglIndo(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

   STATE

let state = DEFAULT_STATE();
let fileHandle = null;          // File System Access API, bila didukung
let activeTab = "menu";
let menuEditId = null;          // id menu yang sedang dibuka di editor
let paketEditId = null;         // id paket yang sedang dibuka di editor

const SUPPORT_FS = typeof window.showSaveFilePicker === "function";

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state = migrasi(JSON.parse(raw));
  } catch (e) {
    toast("Data tersimpan tidak terbaca. Memulai dari kosong.", "danger");
  }
}

function migrasi(data) {
  const base = DEFAULT_STATE();
  if (!data || typeof data !== "object") return base;
  const settings = Object.assign(base.settings, data.settings || {});
  // Versi lama menyimpan "Langsung / WhatsApp" sebagai channel biasa berkomisi 0%.
  // Sekarang jalur langsung dipisah dari daftar channel, jadi entri lama itu dibuang.
  settings.channels = (settings.channels || []).filter(
    (c) => (c.nama || "").trim().toLowerCase() !== "langsung / whatsapp"
  );
  return {
    version: 1,
    settings,
    bahan: Array.isArray(data.bahan) ? data.bahan : [],
    menu: Array.isArray(data.menu) ? data.menu : [],
    bundling: Array.isArray(data.bundling) ? data.bundling : [],
  };
}

async function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) {
    toast("Gagal menyimpan ke browser. Penyimpanan mungkin penuh atau diblokir.", "danger");
  }
  if (fileHandle) {
    try {
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(backupPayload(), null, 2));
      await w.close();
    } catch (e) {
      fileHandle = null;
      toast("Koneksi ke file terputus. Data tetap tersimpan di browser.", "danger");
      renderStorage();
    }
  }
}

/* ============================================================
   PERHITUNGAN
   ============================================================ */

// Harga per satuan dasar (per gram / per ml / per pcs).
function hargaPerBase(b) {
  const k = KELAS[b.kelas];
  if (!k) return NaN;
  let qty = Number(b.qtyBeli);
  if (b.satuanBeli === "kg" || b.satuanBeli === "l") qty *= 1000;
  if (!qty || qty <= 0) return NaN;
  return Number(b.hargaBeli) / qty;
}

// Konversi jumlah pemakaian ke satuan dasar bahan.
// Mengembalikan { value, error }.
function keBase(b, qty, satuan) {
  const s = state.settings;
  const q = Number(qty);
  if (!isFinite(q)) return { value: NaN, error: "Jumlah tidak valid" };
  const mlDari = (sat) => ({ ml: 1, l: 1000, sdt: s.mlSdt, sdm: s.mlSdm, gelas: s.mlGelas }[sat]);

  if (b.kelas === "hitung") {
    if (satuan === "pcs") return { value: q };
    if (b.pembagian && b.pembagian.nama && satuan === b.pembagian.nama) {
      const j = Number(b.pembagian.jumlah);
      if (!(j > 0)) return { value: NaN, error: "Jumlah potongan per " + labelSatuan(b, "pcs") + " belum diisi" };
      return { value: q / j };
    }
    if (SATUAN_BERAT.includes(satuan)) {
      const g = Number(b.gramPerPcs);
      if (!(g > 0)) return { value: NaN, error: "Berat per " + labelSatuan(b, "pcs") + " belum diisi" };
      return { value: (satuan === "kg" ? q * 1000 : q) / g };
    }
    return { value: NaN, error: "Satuan tidak cocok dengan bahan ini" };
  }

  if (b.kelas === "berat") {
    if (satuan === "g") return { value: q };
    if (satuan === "kg") return { value: q * 1000 };
    if (SATUAN_VOLUME.includes(satuan)) {
      const d = globalDensitas();
      if (!(d > 0)) return { value: NaN, error: "Isi takaran sendok di Setting untuk memakai satuan ini" };
      return { value: q * mlDari(satuan) * d };
    }
  }

  if (b.kelas === "volume") {
    if (SATUAN_VOLUME.includes(satuan)) return { value: q * mlDari(satuan) };
    if (SATUAN_BERAT.includes(satuan)) {
      const d = globalDensitas();
      if (!(d > 0)) return { value: NaN, error: "Isi takaran sendok di Setting untuk memakai satuan ini" };
      return { value: (satuan === "kg" ? q * 1000 : q) / d };
    }
  }

  return { value: NaN, error: "Satuan tidak cocok dengan kelas bahan" };
}

// Harga per satuan besar agar terbaca (per kg / per liter / per satuan hitungan).
function hargaSatuanTampil(perBase, baseUnit, b) {
  if (!isFinite(perBase)) return "-";
  if (baseUnit === "pcs") return rp(perBase) + "/" + labelSatuan(b, "pcs");
  return rp(perBase * 1000) + "/" + (baseUnit === "g" ? "kg" : "liter");
}

function hitungMenu(m) {
  const rows = [];
  let subtotal = 0;
  let adaError = false;

  (m.items || []).forEach((it) => {
    const b = state.bahan.find((x) => x.id === it.bahanId);
    if (!b) {
      rows.push({ nama: "(bahan terhapus)", qty: it.qty, satuan: it.satuan, base: NaN, biaya: NaN, error: "Bahan tidak ditemukan di master" });
      adaError = true;
      return;
    }
    const konv = keBase(b, it.qty, it.satuan);
    const perBase = hargaPerBase(b);
    const biaya = konv.value * perBase;
    if (konv.error || !isFinite(biaya)) adaError = true;
    rows.push({
      bahan: b,
      nama: b.nama,
      qty: Number(it.qty),
      satuan: it.satuan,
      base: konv.value,
      baseUnit: KELAS[b.kelas].base,
      perBase,
      biaya,
      error: konv.error || (!isFinite(perBase) ? "Harga beli bahan belum lengkap" : null),
      stale: hariSejak(b.updatedAt) != null && hariSejak(b.updatedAt) > state.settings.staleDays,
    });
    if (isFinite(biaya)) subtotal += biaya;
  });

  const porsi = Number(m.porsi) > 0 ? Number(m.porsi) : 1;
  const bahanPerPorsi = subtotal / porsi;
  const overhead = Number(m.overheadPerPorsi) || 0;
  // Dibulatkan ke rupiah penuh di sini, sebelum dipakai menghitung margin dan harga jual.
  // Tanpa ini, margin dan harga jual bisa dibulatkan ke arah berbeda dari sumber yang sama
  // (satu ke atas, satu ke bawah) dan menghasilkan selisih semu Rp 1 di layar.
  const hpp = Math.round(bahanPerPorsi + overhead);
  const margin = (Number(m.marginTarget) || 0) / 100;

  // Harga langsung (Langsung/WhatsApp): HPP dinaikkan sebesar margin, tanpa potongan channel.
  // Channel selain Langsung/WhatsApp: (HPP + margin) dinaikkan lagi sebesar komisi channel,
  // sehingga laba bersih yang diterima tetap sama dengan jalur langsung.
  const harga = hitungHargaJual(hpp, m.marginTarget);

  return { rows, subtotal, porsi, bahanPerPorsi, overhead, hpp, margin, ...harga, adaError };
}

// Menghitung harga langsung dan harga per channel dari satu angka HPP dan target margin (%).
// Dipakai bersama oleh Menu dan Paket supaya rumusnya konsisten di kedua tempat.
function hitungHargaJual(hpp, marginTargetPct) {
  const margin = (Number(marginTargetPct) || 0) / 100;
  const hargaLangsung = margin < 1 ? hpp / (1 - margin) : NaN;
  const marginRupiah = isFinite(hargaLangsung) ? hargaLangsung - hpp : NaN;
  const labaLangsung = isFinite(hargaLangsung) ? hargaLangsung - hpp : NaN;

  const channels = state.settings.channels.map((c) => {
    const komisi = (Number(c.komisi) || 0) / 100;
    let hargaChannel = NaN;
    if (isFinite(hargaLangsung) && komisi < 1) hargaChannel = (hpp + marginRupiah) / (1 - komisi);
    const diterima = hargaChannel * (1 - komisi);
    return { nama: c.nama, komisi: Number(c.komisi) || 0, harga: hargaChannel, diterima, laba: diterima - hpp };
  });

  return { hargaLangsung, marginRupiah, labaLangsung, channels };
}

// HPP paket = jumlah (HPP menu × qty) untuk setiap menu di dalam paket. Tanpa overhead sendiri -
// overhead sudah tercakup di HPP masing-masing menu.
function hitungPaket(bd) {
  const rows = [];
  let subtotal = 0;
  let adaError = false;

  (bd.items || []).forEach((it) => {
    const menu = state.menu.find((x) => x.id === it.menuId);
    if (!menu) {
      rows.push({ nama: "(menu terhapus)", qty: it.qty, hppSatuan: NaN, subtotal: NaN, error: "Menu tidak ditemukan" });
      adaError = true;
      return;
    }
    const hasilMenu = hitungMenu(menu);
    if (hasilMenu.adaError) adaError = true;
    const qty = Number(it.qty) > 0 ? Number(it.qty) : 0;
    const rowSubtotal = hasilMenu.hpp * qty;
    rows.push({
      nama: menu.nama || "Tanpa nama",
      qty,
      hppSatuan: hasilMenu.hpp,
      subtotal: rowSubtotal,
      error: hasilMenu.adaError ? "Menu ini punya bahan yang belum bisa dihitung" : null,
    });
    subtotal += rowSubtotal;
  });

  const hpp = Math.round(subtotal);
  const harga = hitungHargaJual(hpp, bd.marginTarget);

  return { rows, hpp, ...harga, adaError };
}

function render() {
  renderStorage();
  document.querySelectorAll(".tab-btn").forEach((b) => {
    const on = b.dataset.tab === activeTab;
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.getElementById("view-menu").classList.toggle("hidden", activeTab !== "menu");
  document.getElementById("view-bahan").classList.toggle("hidden", activeTab !== "bahan");
  document.getElementById("view-paket").classList.toggle("hidden", activeTab !== "paket");
  document.getElementById("view-setting").classList.toggle("hidden", activeTab !== "setting");

  document.getElementById("current-section").textContent = ({menu:"Menu",bahan:"Bahan",paket:"Paket",setting:"Pengaturan"})[activeTab];
  if (activeTab === "menu") renderMenu();
  if (activeTab === "bahan") renderBahan();
  if (activeTab === "paket") renderPaket();
  if (activeTab === "setting") renderSetting();
}

function renderStorage() {
  document.getElementById("storage-chip").textContent = fileHandle ? "Tersambung ke file" : "Browser saja";
  document.getElementById("save-label").textContent = fileHandle ? "Tersimpan di browser dan file" : "Tersimpan di browser";
}

function toast(msg, tone = "ok") {
  const el = document.getElementById("toast");
  const bg = tone === "danger" ? "#B04A4A" : tone === "warning" ? "#C78E3F" : "#141413";
  el.innerHTML = '<div class="px-4 py-2.5 rounded-row text-sm text-white shadow-lg" style="background:' + bg + '">' + esc(msg) + "</div>";
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 3200);
}

function modal(title, bodyHtml, footerHtml) {
  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="fixed inset-0 z-40 bg-slate/40 flex items-end sm:items-center justify-center p-0 sm:p-4" data-close-modal>' +
      '<div class="bg-white w-full sm:max-w-lg rounded-t-panel sm:rounded-panel border-[1.5px] border-gray-300 max-h-[92vh] overflow-y-auto" role="dialog" aria-modal="true">' +
        '<div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">' +
          '<h2 class="text-lg">' + esc(title) + "</h2>" +
          '<button class="btn btn-ghost h-8 px-2" data-close-modal aria-label="Tutup">x</button>' +
        "</div>" +
        '<div class="px-5 py-5">' + bodyHtml + "</div>" +
        (footerHtml ? '<div class="px-5 py-4 border-t border-gray-100 flex gap-2 justify-end sticky bottom-0 bg-white">' + footerHtml + "</div>" : "") +
      "</div>" +
    "</div>";
  root.querySelectorAll("[data-close-modal]").forEach((el) => {
    el.addEventListener("click", (e) => { if (e.target === el) closeModal(); });
  });
}

function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
}

function renderMenu() {
  const v = document.getElementById("view-menu");
  if (!state.menu.some(m => m.id === menuEditId)) menuEditId = state.menu[0]?.id || null;
  v.innerHTML = `<aside class="menu-browser"><div class="menu-browser-head"><div><h2>Menu</h2><p class="menu-count">${state.menu.length} menu - ${state.bundling.length} paket</p></div><button class="btn btn-primary" id="btn-menu-baru">${icon("plus")}Menu baru</button></div><div class="menu-search">${icon("search")}<input id="menu-search" type="search" placeholder="Cari menu..." aria-label="Cari menu"></div><div class="recipe-list" id="recipe-list"></div><div class="list-bottom"><span>${state.bahan.length} bahan di master</span><button id="open-master">Kelola bahan</button></div></aside><div class="editor-space" id="menu-detail"></div>`;
  renderRecipeList("");
  document.getElementById("menu-search").addEventListener("input", e => renderRecipeList(e.target.value));
  document.getElementById("btn-menu-baru").addEventListener("click", menuBaru);
  document.getElementById("open-master").addEventListener("click", () => { activeTab = "bahan"; render(); });
  if (menuEditId) renderMenuEditor(document.getElementById("menu-detail"));
  else document.getElementById("menu-detail").innerHTML = `<div class="editor-empty"><h1>Mulai dari menu pertamamu</h1><p>Tambahkan bahan, tentukan porsi dan margin. HPP dan harga jual akan dihitung otomatis.</p><button class="btn btn-primary" onclick="menuBaru()">${icon("plus")}Buat menu</button><p>Sudah punya backup? <button class="text-button" onclick="importBackup()">Import JSON</button></p></div>`;
}

function renderRecipeList(query) {
  const list = document.getElementById("recipe-list");
  const menus = state.menu.filter(m => m.nama.toLowerCase().includes(query.toLowerCase()));
  list.innerHTML = menus.map(m => {
    const c = hitungMenu(m), i = state.menu.indexOf(m);
    return `<div class="recipe-entry ${m.id === menuEditId ? "selected" : ""}"><button class="recipe-open" data-open-menu="${m.id}" aria-pressed="${m.id === menuEditId}"><span class="recipe-labels"><strong>${esc(m.nama || "Menu baru")}</strong><span>${c.porsi} porsi</span></span><span class="recipe-prices"><span>HPP ${c.adaError ? "Periksa bahan" : rp(c.hpp)}</span><b>${rp(c.hargaLangsung)}</b></span></button><div class="recipe-order"><button data-order="${i}" data-direction="-1" ${i === 0 ? "disabled" : ""}>Naik</button><button data-order="${i}" data-direction="1" ${i === state.menu.length - 1 ? "disabled" : ""}>Turun</button></div></div>`;
  }).join("") || '<p class="menu-count" style="padding:15px 4px">Tidak ada menu yang cocok.</p>';
  list.querySelectorAll("[data-open-menu]").forEach(el => el.addEventListener("click", () => { menuEditId = el.dataset.openMenu; renderRecipeList(query); renderMenuEditor(document.getElementById("menu-detail")); }));
  list.querySelectorAll("[data-order]").forEach(el => el.addEventListener("click", () => { const i = Number(el.dataset.order), j = i + Number(el.dataset.direction); [state.menu[i], state.menu[j]] = [state.menu[j], state.menu[i]]; save(); renderRecipeList(query); }));
}

function menuBaru() {
  const m = {
    id: uid(),
    nama: "",
    porsi: 1,
    overheadPerPorsi: 0,
    marginTarget: state.settings.marginDefault,
    items: [],
    updatedAt: todayISO(),
  };
  state.menu.push(m);
  menuEditId = m.id;
  save();
  render();
}

// Markup panel "Harga langsung" + tabel "Channel lainnya", dipakai bersama oleh
// editor Menu dan editor Paket supaya tampilannya konsisten di kedua tempat.
// Menyamakan nama channel supaya "GrabFood", "Grab Food", "grab-food" dianggap sama -
// hanya huruf yang dibandingkan, tanpa spasi/tanda baca/kapitalisasi.
function normalisasiNamaChannel(s) {
  return (s || "").toLowerCase().replace(/[^a-z]/g, "");
}

// Ambil harga jual Langsung, GrabFood, GoFood, ShopeeFood dari hasil hitungMenu/hitungPaket.
// Kalau salah satu channel itu belum diatur di Setting, nilainya NaN dan tampil "-".
function hargaChannelUtama(hasil) {
  const cari = (target) => {
    const ch = hasil.channels.find((c) => normalisasiNamaChannel(c.nama) === target);
    return ch ? ch.harga : NaN;
  };
  return {
    langsung: hasil.hargaLangsung,
    grabfood: cari("grabfood"),
    gofood: cari("gofood"),
    shopeefood: cari("shopeefood"),
  };
}

// Grid 2x2 ringkas untuk kartu list (Menu maupun Paket) - dipakai bersama supaya konsisten.
function markupHargaRingkasKartu(hasil) {
  const h = hargaChannelUtama(hasil);
  const item = (label, val) =>
    "<div>" +
      '<div class="font-mono text-[10px] uppercase tracking-[0.06em] text-gray-500">' + label + "</div>" +
      '<div class="text-sm font-medium mt-0.5">' + rp(val) + "</div>" +
    "</div>";
  return (
    '<div class="grid grid-cols-2 gap-x-4 gap-y-2 mt-3">' +
      item("Langsung", h.langsung) + item("GrabFood", h.grabfood) + item("GoFood", h.gofood) + item("ShopeeFood", h.shopeefood) +
    "</div>"
  );
}

function markupHargaJual(marginTargetPct, harga) {
  const channelRows = harga.channels.map((ch) =>
    "<tr>" +
      '<td class="px-4 py-3 text-sm">' + esc(ch.nama) + '<span class="text-gray-500"> - komisi ' + num(ch.komisi, 1) + "%</span></td>" +
      '<td class="px-4 py-3 text-sm text-right font-medium">' + rp(ch.harga) + "</td>" +
      '<td class="px-4 py-3 text-sm text-right' + (ch.laba < 0 ? " text-danger" : "") + '">' + rp(ch.laba) + "</td>" +
    "</tr>"
  ).join("");

  return (
    '<div class="panel p-5 mb-4">' +
      '<div class="flex items-end justify-between gap-4">' +
        "<div>" +
          '<div class="lbl">Harga langsung <span class="normal-case text-gray-500">(Langsung / WhatsApp)</span></div>' +
          '<div class="font-serif text-[36px] leading-none">' + (isFinite(harga.hargaLangsung) ? rp(harga.hargaLangsung) : "-") + "</div>" +
        "</div>" +
        '<div class="text-sm text-right text-gray-700 space-y-0.5">' +
          "<div>Margin " + num(marginTargetPct, 1) + "% = " + rp(harga.marginRupiah) + "</div>" +
          "<div>Laba " + rp(harga.labaLangsung) + "</div>" +
        "</div>" +
      "</div>" +
      '<p class="text-xs text-gray-500 mt-2">Tidak ada potongan komisi. Channel lain di bawah dihitung dari angka ini.</p>' +
    "</div>" +

    (state.settings.channels.length
      ? '<div class="panel overflow-hidden mb-4">' +
          '<div class="px-5 py-4 border-b border-gray-100">' +
            '<h2 class="text-lg">Channel lainnya</h2>' +
            '<p class="text-xs text-gray-500 mt-0.5">(HPP + margin) dibagi (1 - komisi), agar laba tetap sama dengan jalur langsung.</p>' +
          "</div>" +
          '<table class="w-full border-collapse">' +
            '<thead><tr class="bg-gray-100">' +
              '<th class="px-4 py-2.5 text-left font-mono text-[11px] uppercase tracking-[0.06em] text-gray-500">Channel</th>' +
              '<th class="px-4 py-2.5 text-right font-mono text-[11px] uppercase tracking-[0.06em] text-gray-500">Harga jual</th>' +
              '<th class="px-4 py-2.5 text-right font-mono text-[11px] uppercase tracking-[0.06em] text-gray-500">Laba/porsi</th>' +
            "</tr></thead>" +
            "<tbody class='divide-y divide-gray-100'>" + channelRows + "</tbody>" +
          "</table>" +
        "</div>"
      : '<div class="panel px-5 py-6 text-center mb-4">' +
          '<p class="text-sm text-gray-500">Belum ada channel selain Langsung/WhatsApp. Tambahkan di tab Setting.</p>' +
        "</div>")
  );
}
function renderMenuEditor(v) {
  const m = state.menu.find((x) => x.id === menuEditId);
  if (!m) { menuEditId = null; return renderMenu(); }
  const c = hitungMenu(m);

  const staleRows = c.rows.filter(r => r.stale);
  const itemRows = m.items.map((it, i) => {
    const r = c.rows[i], b = r.bahan;
    const options = state.bahan.slice().sort((a,b) => a.nama.localeCompare(b.nama)).map(x => `<option value="${x.id}" ${x.id === it.bahanId ? "selected" : ""}>${esc(x.nama)}</option>`).join("");
    const units = satuanUntuk(b).map(unit => `<option value="${esc(unit)}" ${unit === it.satuan ? "selected" : ""}>${esc(labelSatuan(b,unit))}</option>`).join("");
    return `<tr><td><select class="fld ingredient-name" data-item-bahan="${i}" aria-label="Bahan baris ${i+1}"><option value="">Pilih bahan</option>${options}</select><div class="ingredient-meta ${r.error ? "text-danger" : ""}">${r.error ? esc(r.error) : esc(hargaSatuanTampil(r.perBase,r.baseUnit,b))}</div></td><td><input class="fld ingredient-qty" type="number" min="0" step="any" value="${esc(it.qty)}" data-item-qty="${i}" aria-label="Jumlah bahan baris ${i+1}"></td><td><select class="fld ingredient-unit" data-item-satuan="${i}" aria-label="Satuan bahan baris ${i+1}">${units}</select></td><td class="money">${rp(r.biaya)}</td><td><button class="delete-row" data-item-hapus="${i}" aria-label="Hapus bahan baris ${i+1}">${icon("trash")}</button></td></tr>`;
  }).join("");
  v.innerHTML = `
    <div class="editor-heading"><div style="min-width:0;flex:1"><input class="editor-name fld" value="${esc(m.nama)}" data-m="nama" placeholder="Nama menu baru" aria-label="Nama menu"><p>Kelola resep, hitung HPP dan tentukan harga jual.</p></div><div class="heading-actions"><button class="btn btn-secondary" id="btn-export-md">${icon("document")}Export MD</button><button class="btn btn-danger" id="btn-hapus-menu">${icon("trash")}Hapus</button></div></div>
    <div class="editor-controls"><div class="control-box"><label class="lbl" for="recipe-portions">Jumlah porsi seresep</label><div class="field-affix"><input id="recipe-portions" type="number" min="1" step="1" value="${esc(m.porsi)}" data-m="porsi"><span>porsi</span></div></div><div class="control-box"><label class="lbl" for="recipe-overhead">Overhead per porsi</label><div class="field-affix"><span>Rp</span><input id="recipe-overhead" type="number" min="0" step="any" value="${esc(m.overheadPerPorsi)}" data-m="overheadPerPorsi"></div></div><div class="control-box"><label class="lbl" for="recipe-margin">Target margin</label><div class="field-affix"><input id="recipe-margin" type="number" min="0" max="99" step="any" value="${esc(m.marginTarget)}" data-m="marginTarget"><span>%</span></div></div></div>
    <div class="editor-columns"><div><section class="panel recipe-panel"><div class="panel-head"><div><h2>Bahan dalam resep</h2><p>Jumlah bahan untuk ${num(c.porsi,0)} porsi, sebelum overhead.</p></div><button class="btn btn-primary" id="btn-item-tambah">${icon("plus")}Bahan</button></div><div class="ingredient-scroll" tabindex="0" role="region" aria-label="Tabel bahan resep. Geser horizontal untuk melihat biaya."><table class="ingredient-table"><thead><tr><th>Bahan</th><th>Jumlah</th><th>Satuan</th><th style="text-align:right">Biaya</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody>${itemRows || '<tr><td colspan="5" style="padding:30px 20px;color:#63706f">Belum ada bahan. Tambahkan bahan untuk menghitung HPP.</td></tr>'}</tbody></table></div><div class="ingredient-footer"><div class="ingredient-tools"><button class="text-button" id="btn-bahan-cepat">Buat bahan baru</button><button class="text-button" id="btn-salin-menu">Salin dari menu lain</button></div></div><div class="recipe-total"><span>Total bahan seresep</span><strong>${rp(c.subtotal)}</strong></div></section>
    ${staleRows.length ? `<aside class="stale-notice">${icon("alert")}<div><strong>${staleRows.length} bahan perlu diperbarui harganya</strong><p>Harga terakhir diperbarui lebih dari ${state.settings.staleDays} hari lalu. ${esc(staleRows.slice(0,3).map(r => r.nama).join(", "))}${staleRows.length > 3 ? ", dan lainnya." : "."}</p><button id="review-prices">Periksa harga bahan</button></div></aside>` : ""}
    ${c.adaError ? '<div class="stale-notice"><p class="text-danger">Ada bahan yang belum bisa dihitung. Periksa nama bahan, jumlah, dan satuannya.</p></div>' : ""}</div>
    <aside class="summary-stack"><section class="panel summary-panel"><h2>Ringkasan biaya</h2><p>Biaya untuk satu porsi menu.</p><div class="cost-line"><span>Bahan per porsi</span><strong>${rp(c.bahanPerPorsi)}</strong></div><div class="cost-line"><span>Overhead per porsi</span><strong>${rp(c.overhead)}</strong></div><div class="hpp-line"><span>HPP per porsi</span><strong>${c.adaError ? "Periksa bahan" : rp(c.hpp)}</strong></div><p class="cost-note">Overhead mencakup gas, listrik, kemasan atau tenaga.</p></section><section class="panel summary-panel"><h2>Harga jual per channel</h2><p>Komisi diperhitungkan agar laba bersih tetap sama.</p><div class="direct-price"><span>Langsung / WhatsApp</span><strong>${rp(c.hargaLangsung)}</strong><p>Margin ${num(m.marginTarget)}% - Laba ${rp(c.labaLangsung)}/porsi</p></div>${c.channels.map(ch => `<div class="channel-line"><span>${esc(ch.nama)}<small>Komisi ${num(ch.komisi)}%</small></span><strong>${rp(ch.harga)}</strong></div>`).join("") || '<p class="cost-note">Tambahkan channel di Pengaturan.</p>'}</section></aside></div>
    <footer class="editor-bottom"><span>${icon("check")}Perubahan disimpan otomatis</span><button class="text-button" id="btn-export-json-menu">Export detail menu (JSON)</button></footer><button id="btn-kembali" class="hidden" tabindex="-1">Semua menu</button>`;
  const review = document.getElementById("review-prices");
  if (review) review.addEventListener("click", () => { activeTab = "bahan"; render(); });

  // --- listeners editor
  document.getElementById("btn-kembali").addEventListener("click", () => { menuEditId = null; render(); });

  v.querySelectorAll("[data-m]").forEach((el) => {
    el.addEventListener("change", () => {
      const f = el.dataset.m;
      m[f] = f === "nama" ? el.value : Number(el.value);
      m.updatedAt = todayISO();
      save(); render();
    });
  });

  v.querySelectorAll("[data-item-bahan]").forEach((el) => {
    el.addEventListener("change", () => {
      const i = +el.dataset.itemBahan;
      m.items[i].bahanId = el.value;
      const b = state.bahan.find((x) => x.id === el.value);
      if (b && !satuanUntuk(b).includes(m.items[i].satuan)) {
        m.items[i].satuan = b.kelas === "hitung" ? "pcs" : KELAS[b.kelas].base;
      }
      save(); render();
    });
  });
  v.querySelectorAll("[data-item-qty]").forEach((el) => {
    el.addEventListener("change", () => { m.items[+el.dataset.itemQty].qty = Number(el.value); save(); render(); });
  });
  v.querySelectorAll("[data-item-satuan]").forEach((el) => {
    el.addEventListener("change", () => { m.items[+el.dataset.itemSatuan].satuan = el.value; save(); render(); });
  });
  v.querySelectorAll("[data-item-hapus]").forEach((el) => {
    el.addEventListener("click", () => { m.items.splice(+el.dataset.itemHapus, 1); save(); render(); });
  });

  document.getElementById("btn-item-tambah").addEventListener("click", () => {
    if (!state.bahan.length) { toast("Belum ada bahan di master. Buat bahan dulu.", "warning"); return formBahan(null, () => {}); }
    m.items.push({ bahanId: "", qty: 0, satuan: "g" });
    save(); render();
  });
  document.getElementById("btn-bahan-cepat").addEventListener("click", () => {
    formBahan(null, (baru) => { m.items.push({ bahanId: baru.id, qty: 0, satuan: baru.kelas === "hitung" ? "pcs" : KELAS[baru.kelas].base }); save(); render(); });
  });
  document.getElementById("btn-salin-menu").addEventListener("click", () => bukaSalinBahan(m));

  document.getElementById("btn-export-md").addEventListener("click", () => exportMarkdownMenu(m));
  document.getElementById("btn-export-json-menu").addEventListener("click", () => exportJsonMenu(m));
  document.getElementById("btn-hapus-menu").addEventListener("click", () => {
    if (!confirm("Hapus menu \"" + (m.nama || "Tanpa nama") + "\"? Tindakan ini tidak bisa dibatalkan.")) return;
    state.menu = state.menu.filter((x) => x.id !== m.id);
    menuEditId = null; save(); render();
    toast("Menu dihapus.");
  });
}

// Salin daftar bahan (referensi bahanId + qty + satuan) dari menu lain ke menu m.
// Menambahkan ke bahan yang sudah ada, tidak menggantikan - supaya tidak ada data yang hilang tanpa sengaja.
function bukaSalinBahan(m) {
  const lain = state.menu.filter((x) => x.id !== m.id);
  const rows = lain.length
    ? lain.map((x) =>
        '<button class="w-full text-left px-4 py-3 rounded-row border-[1.5px] border-gray-300 hover:bg-ivory mb-2 last:mb-0" data-salin-menu="' + x.id + '">' +
          '<div class="flex items-baseline justify-between gap-3">' +
            '<span class="font-medium">' + esc(x.nama || "Tanpa nama") + "</span>" +
            '<span class="text-xs text-gray-500">' + (x.items || []).length + " bahan</span>" +
          "</div>" +
        "</button>"
      ).join("")
    : '<p class="text-sm text-gray-500 py-4 text-center">Belum ada menu lain untuk disalin.</p>';

  modal("Salin bahan dari menu lain",
    "<div>" + rows + "</div>",
    '<button class="btn btn-secondary" id="salin-batal">Batal</button>'
  );
  document.getElementById("salin-batal").addEventListener("click", closeModal);
  document.querySelectorAll("[data-salin-menu]").forEach((el) => {
    el.addEventListener("click", () => {
      const src = state.menu.find((x) => x.id === el.dataset.salinMenu);
      if (!src) return;
      const salinan = (src.items || []).map((it) => ({ bahanId: it.bahanId, qty: it.qty, satuan: it.satuan }));
      m.items = (m.items || []).concat(salinan);
      m.updatedAt = todayISO();
      closeModal(); save(); render();
      toast(salinan.length + ' bahan disalin dari "' + (src.nama || "menu tsb") + '".');
    });
  });
}

/* ============================================================
   TAB - BAHAN
   ============================================================ */

function renderBahan() {
  const v = document.getElementById("view-bahan");
  const list = state.bahan.slice().sort((a, b) => a.nama.localeCompare(b.nama));

  const rows = list.map((b) => {
    const per = hargaPerBase(b);
    const umur = hariSejak(b.updatedAt);
    const stale = umur != null && umur > state.settings.staleDays;
    const satuanTampil = b.kelas === "berat" ? "kg" : b.kelas === "volume" ? "liter" : labelSatuan(b, "pcs");
    const hargaTampil = b.kelas === "hitung" ? per : per * 1000;
    return (
      '<button class="w-full text-left px-5 py-3.5 hover:bg-ivory transition-colors border-b border-gray-100 last:border-0" data-edit-bahan="' + b.id + '">' +
        '<div class="flex items-baseline justify-between gap-3">' +
          '<span class="font-medium">' + esc(b.nama) + "</span>" +
          '<span class="text-sm">' + rp(hargaTampil) + '<span class="text-gray-500 text-xs">/' + satuanTampil + "</span></span>" +
        "</div>" +
        '<div class="flex items-center gap-2 mt-1 flex-wrap">' +
          '<span class="badge bg-gray-100 text-gray-700">' + KELAS[b.kelas].label + "</span>" +
          (b.kelas === "hitung" && b.pembagian && b.pembagian.nama && Number(b.pembagian.jumlah) > 1
            ? '<span class="badge" style="background:rgba(217,119,87,0.14);color:#D97757">1 ' + esc(labelSatuan(b, "pcs")) + " = " + num(b.pembagian.jumlah, 0) + " " + esc(b.pembagian.nama) + "</span>" : "") +
          (b.kelas === "hitung" && Number(b.gramPerPcs) > 0
            ? '<span class="badge bg-gray-100 text-gray-700">~ ' + num(b.gramPerPcs, 0) + " g/" + esc(labelSatuan(b, "pcs")) + "</span>" : "") +
          (stale ? '<span class="badge" style="background:rgba(199,142,63,0.16);color:#A06A2A">' + umur + " hari lalu</span>"
                 : '<span class="text-xs text-gray-500">diperbarui ' + tglIndo(b.updatedAt) + "</span>") +
        "</div>" +
      "</button>"
    );
  }).join("");

  v.innerHTML =
    '<div class="flex items-center justify-between mb-4">' +
      '<h2 class="text-xl">Bahan <span class="text-gray-500 text-base">(' + state.bahan.length + ")</span></h2>" +
      '<button class="btn btn-primary" id="btn-bahan-baru">Bahan baru</button>' +
    "</div>" +
    (list.length
      ? '<div class="panel overflow-hidden">' + rows + "</div>"
      : '<div class="panel px-6 py-10 text-center">' +
          '<h2 class="text-xl mb-2">Belum ada bahan</h2>' +
          '<p class="text-sm text-gray-500 mb-5 max-w-sm mx-auto">Isi harga beli sekali di sini, lalu semua menu yang memakainya ikut terhitung. Ubah harga di satu tempat saja saat harga pasar bergerak.</p>' +
          '<button class="btn btn-primary" id="btn-bahan-baru-2">Tambah bahan</button>' +
        "</div>");

  const a = document.getElementById("btn-bahan-baru");
  const a2 = document.getElementById("btn-bahan-baru-2");
  if (a) a.addEventListener("click", () => formBahan(null));
  if (a2) a2.addEventListener("click", () => formBahan(null));
  v.querySelectorAll("[data-edit-bahan]").forEach((el) => {
    el.addEventListener("click", () => formBahan(state.bahan.find((x) => x.id === el.dataset.editBahan)));
  });
}

function formBahan(b, onSaved) {
  const isBaru = !b;
  const d = b || { id: uid(), nama: "", kelas: "berat", hargaBeli: "", qtyBeli: 1, satuanBeli: "kg", satuanLabel: "", gramPerPcs: null, pembagian: null, updatedAt: null };

  const kelasOpsi = Object.keys(KELAS).map((k) => '<option value="' + k + '"' + (k === d.kelas ? " selected" : "") + ">" + KELAS[k].label + "</option>").join("");

  modal(isBaru ? "Bahan baru" : "Ubah bahan",
    '<div class="space-y-4">' +
      '<div><label class="lbl">Nama bahan</label><input class="fld" id="f-nama" value="' + esc(d.nama) + '" placeholder="Ayam broiler"></div>' +
      '<div><label class="lbl">Kelas satuan</label><select class="fld" id="f-kelas">' + kelasOpsi + "</select>" +
        '<p class="text-xs text-gray-500 mt-1.5">Berat untuk bahan yang ditimbang, volume untuk cairan, hitung untuk yang dihitung per butir atau per pcs.</p></div>' +
      '<div class="grid grid-cols-3 gap-3">' +
        '<div class="col-span-1"><label class="lbl">Harga beli</label><input class="fld text-right" id="f-harga" type="number" min="0" step="any" value="' + esc(d.hargaBeli) + '"></div>' +
        '<div class="col-span-1"><label class="lbl">Isi</label><input class="fld text-right" id="f-qty" type="number" min="0" step="any" value="' + esc(d.qtyBeli) + '"></div>' +
        '<div class="col-span-1"><label class="lbl">Satuan</label><select class="fld" id="f-satuan"></select></div>' +
      "</div>" +
      '<p class="text-xs text-gray-500 -mt-2">Contoh: harga 38000, isi 1, satuan kg.</p>' +
      '<div id="f-hitung" class="bg-oat rounded-panel px-4 py-4 space-y-4">' +
        "<div>" +
          '<label class="lbl">Nama satuan beli</label>' +
          '<input class="fld" id="f-satuan-label" value="' + esc(d.satuanLabel || "") + '" placeholder="ekor">' +
          '<p class="text-xs text-gray-700 mt-1.5">Dipakai sebagai pengganti kata pcs, misalnya ekor, ikat, atau botol.</p>' +
        "</div>" +
        "<div>" +
          '<label class="lbl">Dipotong jadi</label>' +
          '<div class="flex items-center gap-2">' +
            '<span class="text-sm shrink-0">1 satuan =</span>' +
            '<input class="fld w-20 text-right" id="f-bagi-jml" type="number" min="0" step="1" value="' + esc(d.pembagian && d.pembagian.jumlah ? d.pembagian.jumlah : "") + '" placeholder="4">' +
            '<input class="fld flex-1 min-w-0" id="f-bagi-nama" value="' + esc(d.pembagian && d.pembagian.nama ? d.pembagian.nama : "") + '" placeholder="potong">' +
          "</div>" +
          '<p class="text-xs text-gray-700 mt-1.5">Isi kalau bahan dibeli utuh lalu dipakai per bagian. Satuan ini akan muncul di resep.</p>' +
        "</div>" +
        "<div>" +
          '<label class="lbl">Berat per satuan (gram)</label>' +
          '<input class="fld text-right" id="f-gram-pcs" type="number" min="0" step="any" value="' + esc(d.gramPerPcs || "") + '" placeholder="1100">' +
          '<p class="text-xs text-gray-700 mt-1.5">Timbang sendiri, karena berat per ekor berbeda antar pemasok. Mengisinya membuat resep bisa memakai gram.</p>' +
        "</div>" +
      "</div>" +
      '<p class="text-xs text-gray-500 -mt-1">Konversi ke sendok/gelas memakai takaran umum dari Setting, berlaku sama untuk semua bahan.</p>' +
    "</div>",
    (isBaru ? "" : '<button class="btn btn-danger mr-auto" id="f-hapus">Hapus</button>') +
    '<button class="btn btn-secondary" id="f-batal">Batal</button>' +
    '<button class="btn btn-primary" id="f-simpan">Simpan</button>'
  );

  const elKelas = document.getElementById("f-kelas");
  const elSatuan = document.getElementById("f-satuan");
  const elHitung = document.getElementById("f-hitung");

  function syncKelas() {
    const k = elKelas.value;
    elSatuan.innerHTML = KELAS[k].satuanBeli.map((s) => '<option value="' + s + '"' + (s === d.satuanBeli ? " selected" : "") + ">" + s + "</option>").join("");
    elHitung.style.display = k === "hitung" ? "" : "none";
  }
  elKelas.addEventListener("change", syncKelas);
  syncKelas();

  document.getElementById("f-batal").addEventListener("click", closeModal);
  const hp = document.getElementById("f-hapus");
  if (hp) hp.addEventListener("click", () => {
    const dipakai = state.menu.filter((m) => (m.items || []).some((i) => i.bahanId === d.id));
    const pesan = dipakai.length
      ? "Bahan ini dipakai di " + dipakai.length + " menu. Menu tersebut akan menandai barisnya sebagai bermasalah. Tetap hapus?"
      : "Hapus bahan \"" + d.nama + "\"?";
    if (!confirm(pesan)) return;
    state.bahan = state.bahan.filter((x) => x.id !== d.id);
    closeModal(); save(); render();
    toast("Bahan dihapus.");
  });

  document.getElementById("f-simpan").addEventListener("click", () => {
    const nama = document.getElementById("f-nama").value.trim();
    const harga = Number(document.getElementById("f-harga").value);
    const qty = Number(document.getElementById("f-qty").value);
    if (!nama) return toast("Nama bahan belum diisi.", "warning");
    if (!(harga > 0)) return toast("Harga beli harus lebih dari nol.", "warning");
    if (!(qty > 0)) return toast("Isi kemasan harus lebih dari nol.", "warning");

    const kelas = elKelas.value;
    const bagiJml = Number(document.getElementById("f-bagi-jml").value);
    const bagiNama = document.getElementById("f-bagi-nama").value.trim();
    const gramPcs = Number(document.getElementById("f-gram-pcs").value);

    Object.assign(d, {
      nama, kelas, hargaBeli: harga, qtyBeli: qty,
      satuanBeli: elSatuan.value,
      satuanLabel: kelas === "hitung" ? (document.getElementById("f-satuan-label").value.trim() || "") : "",
      gramPerPcs: kelas === "hitung" && gramPcs > 0 ? gramPcs : null,
      pembagian: kelas === "hitung" && bagiJml > 1 && bagiNama ? { nama: bagiNama, jumlah: bagiJml } : null,
      updatedAt: todayISO(),
    });
    if (isBaru) state.bahan.push(d);
    closeModal(); save(); render();
    toast(isBaru ? "Bahan ditambahkan." : "Bahan diperbarui.");
    if (onSaved) onSaved(d);
  });
}

function renderPaket() {
  const v = document.getElementById("view-paket");
  if (paketEditId) return renderPaketEditor(v);

  if (!state.bundling.length) {
    v.innerHTML =
      '<div class="panel px-6 py-10 text-center">' +
        '<h2 class="text-xl mb-2">Belum ada paket</h2>' +
        '<p class="text-sm text-gray-500 mb-5 max-w-sm mx-auto">Gabungkan beberapa menu jadi satu paket - HPP-nya otomatis dijumlahkan dari menu-menu di dalamnya.</p>' +
        (state.menu.length
          ? '<button class="btn btn-primary" id="btn-paket-baru">Buat paket</button>'
          : '<p class="text-xs text-gray-500">Buat menu terlebih dahulu di tab Menu sebelum membuat paket.</p>') +
      "</div>";
  } else {
    const cards = state.bundling.map((bd) => {
      const c = hitungPaket(bd);
      return (
        '<button class="panel w-full text-left px-5 py-4 hover:bg-ivory transition-colors" data-open-paket="' + bd.id + '">' +
          '<div class="flex items-baseline justify-between gap-3">' +
            '<span class="font-medium">' + esc(bd.nama || "Tanpa nama") + "</span>" +
            '<span class="text-xs text-gray-500 shrink-0">HPP ' + (c.adaError ? "!" : rp(c.hpp)) + "</span>" +
          "</div>" +
          markupHargaRingkasKartu(c) +
          '<div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-100 flex-wrap">' +
            '<span class="text-xs text-gray-500">1 porsi</span>' +
            (c.adaError ? '<span class="badge" style="background:rgba(176,74,74,0.14);color:#B04A4A">Perlu diperiksa</span>' : "") +
          "</div>" +
        "</button>"
      );
    }).join("");

    v.innerHTML =
      '<div class="flex items-center justify-between mb-4">' +
        '<h2 class="text-xl">Paket <span class="text-gray-500 text-base">(' + state.bundling.length + ")</span></h2>" +
        '<button class="btn btn-primary" id="btn-paket-baru">Paket baru</button>' +
      "</div>" +
      '<div class="grid gap-3">' + cards + "</div>";
  }

  const nb = document.getElementById("btn-paket-baru");
  if (nb) nb.addEventListener("click", paketBaru);
  v.querySelectorAll("[data-open-paket]").forEach((el) => {
    el.addEventListener("click", () => { paketEditId = el.dataset.openPaket; render(); });
  });
}

function paketBaru() {
  if (!state.menu.length) { toast("Buat menu dulu sebelum membuat paket.", "warning"); return; }
  const bd = {
    id: uid(),
    nama: "",
    items: [],
    marginTarget: state.settings.marginDefault,
    updatedAt: todayISO(),
  };
  state.bundling.push(bd);

/* ============================================================
   PENYIMPANAN FILE & EXPORT
   ============================================================ */

function backupPayload() {
  return {
    tipe: "hpp-calculator-backup",
    version: 1,
    exportedAt: todayISO(),
    settings: state.settings,
    bahan: state.bahan,
    menu: state.menu,
    bundling: state.bundling,
  };
}

function unduh(nama, isi, mime) {
  const blob = new Blob([isi], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function slug(s) {
  return (s || "menu").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "menu";
}

function stampFile() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}

async function fsSambungkan() {
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: "hpp-data.json",
      types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
    });
    await save();
    renderStorage(); render();
    toast("Tersambung. Perubahan akan ikut ditulis ke file.");
  } catch (e) { /* dibatalkan user */ }
}

async function fsBuka() {
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
    const file = await h.getFile();
    const data = JSON.parse(await file.text());
    if (!confirm("Ganti seluruh data saat ini dengan isi file tersebut?")) return;
    state = migrasi(data);
    fileHandle = h;
    menuEditId = null;
    await save(); render();
    toast("Data dimuat dari file.");
  } catch (e) {
    if (e && e.name !== "AbortError") toast("File tidak bisa dibaca. Pastikan itu file backup dari app ini.", "danger");
  }
}

function exportBackup() {
  unduh("hpp-backup-" + stampFile() + ".json", JSON.stringify(backupPayload(), null, 2), "application/json");
}

function importBackup() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", async () => {
    const f = inp.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!confirm("Ganti seluruh data saat ini dengan isi file tersebut?")) return;
      state = migrasi(data); menuEditId = null; save(); render();
      toast("Data berhasil diimpor.");
    } catch (e) {
      toast("File tidak bisa dibaca. Pastikan itu file backup dari app ini.", "danger");
    }
  });
  inp.click();
}

function markdownMenu(m) {
  const c = hitungMenu(m);
  const L = [];
  L.push("## " + (m.nama || "Tanpa nama"));
  L.push("");
  L.push("- Porsi seresep: **" + num(c.porsi, 0) + "**");
  L.push("- Overhead per porsi: **" + rp(c.overhead) + "**");
  L.push("- Target margin bersih: **" + num(m.marginTarget, 1) + "%**");
  L.push("");
  L.push("### Bahan");
  L.push("");
  L.push("| Bahan | Dipakai | Setara | Harga satuan | Biaya |");
  L.push("|---|---|---|---|---|");
  c.rows.forEach((r) => {
    const setara = isFinite(r.base) ? num(r.base) + " " + r.baseUnit : "-";
    const hargaSat = hargaSatuanTampil(r.perBase, r.baseUnit, r.bahan);
    L.push("| " + r.nama + " | " + num(r.qty) + " " + r.satuan + " | " + setara + " | " + hargaSat + " | " + (isFinite(r.biaya) ? rp(r.biaya) : "-") + " |");
  });
  L.push("| **Total seresep** | | | | **" + rp(c.subtotal) + "** |");
  L.push("");
  L.push("### HPP");
  L.push("");
  L.push("| Komponen | Per porsi |");
  L.push("|---|---|");
  L.push("| Bahan | " + rp(c.bahanPerPorsi) + " |");
  L.push("| Overhead | " + rp(c.overhead) + " |");
  L.push("| **HPP** | **" + rp(c.hpp) + "** |");
  L.push("");
  L.push("### Harga jual");
  L.push("");
  L.push("| Channel | Komisi | Harga jual | Laba/porsi |");
  L.push("|---|---|---|---|");
  L.push("| Langsung / WhatsApp | 0% | " + rp(c.hargaLangsung) + " | " + rp(c.labaLangsung) + " |");
  c.channels.forEach((ch) => {
    L.push("| " + ch.nama + " | " + num(ch.komisi, 1) + "% | " + rp(ch.harga) + " | " + rp(ch.laba) + " |");
  });
  if (c.adaError) {
    L.push("");
    L.push("> Catatan: ada baris bahan yang belum bisa dihitung saat laporan ini dibuat.");
  }

  return L.join("\n");
}

    "",

function markdownSnapshot() {
  const L = ["", "---", "", "## Harga bahan saat laporan ini dibuat", "", "| Bahan | Harga beli | Isi | Diperbarui |", "|---|---|---|---|"];
  state.bahan.forEach((b) => {

function exportMarkdownMenu(m) {

function exportMarkdownSemua() {
  if (!state.menu.length) return toast("Belum ada menu untuk diekspor.", "warning");
  const isi = markdownHeader() + state.menu.map(markdownMenu).join("\n\n---\n\n") + markdownSnapshot() + "\n";
  unduh("hpp-semua-menu-" + stampFile() + ".md", isi, "text/markdown");
}

/* ============================================================
   INISIALISASI
   ============================================================ */

document.querySelectorAll(".tab-btn").forEach((b) => {
  b.addEventListener("click", () => {
    activeTab = b.dataset.tab;
    if (activeTab !== "menu") menuEditId = null;
    if (activeTab !== "paket") paketEditId = null;
    render();
  });
});
document.getElementById("storage-chip").addEventListener("click", () => { activeTab = "setting"; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("side-export").addEventListener("click", exportBackup);
document.getElementById("side-import").addEventListener("click", importBackup);
document.getElementById("side-markdown").addEventListener("click", exportMarkdownSemua);
document.querySelectorAll("[data-side]").forEach(el => el.addEventListener("click", () => { activeTab = el.dataset.side; render(); }));
loadLocal();
render();
